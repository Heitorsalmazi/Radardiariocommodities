name: Sync Excel Data

# CADÊNCIA — leia antes de mexer no cron
# ────────────────────────────────────────────────────────────────────────
# O cron anterior era "*/20 * * * *": pedia 72 execuções por dia e o GitHub
# entregava 5,8 — 8%. Medido sobre 30 dias (02/09 a 02/10/2026). A
# documentação deles é explícita: "Scheduled events can be delayed during
# periods of high loads" e "if the load is sufficiently high enough, some
# queued jobs may be dropped".
#
# Pior: TODO workflow agendado deste repositório atrasava ~5h. O da ANTT
# pede 07:40 UTC e saía entre 12:26 e 15:56; o de pedágios pede 06:25 e
# saía entre 11:33 e 14:09. Os dois pedem horários separados por uma hora
# e saem na mesma faixa — o horário pedido quase não importa, o que manda
# é quando a fila do repositório esvazia. A suspeita é que o */20, único
# cron de alta frequência daqui, mantinha essa fila saturada e os outros
# quatro pagavam a conta. Se os atrasos deles encolherem depois desta
# mudança, a suspeita estava certa.
#
# Daí os dois gatilhos de naturezas diferentes:
#   schedule     — poucos pedidos, minuto quebrado. Continua sendo um
#                  PEDIDO: o GitHub atende quando tem folga.
#   workflow_run — carona no término dos outros workflows. NÃO passa pelo
#                  agendador, então é o único disparo pontual possível
#                  aqui sem precisar de token.
#
# A planilha muda 1 a 2 vezes por dia, quase sempre entre 10h e 12h UTC
# (07h-09h BRT), e nunca no fim de semana. A carona cai logo depois disso,
# que é justamente quando há algo novo para buscar.

on:
  schedule:
    - cron: '11 9 * * *'
    - cron: '11 13 * * *'
    - cron: '11 17 * * *'
    - cron: '11 21 * * *'

  workflow_run:
    workflows:
      - "Atualiza base de pedágios"
      - "Atualiza coeficientes da ANTT"
      - "Atualiza base de opções"
    types: [completed]

  workflow_dispatch:         # permite rodar manualmente pelo GitHub quando quiser

# Duas execuções ao mesmo tempo disputariam o mesmo dados.xlsx. Com a
# carona isso deixou de ser hipótese: o sync passa a disparar logo depois
# dos outros workflows, que podem cair quase juntos.
concurrency:
  group: sync-dados
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          # Na carona (workflow_run) o checkout padrão pega o commit em que
          # o workflow de cima rodou, que já pode estar atrás do main — e aí
          # o push nasce rejeitado. Fixar em main resolve na origem.
          ref: main

      - name: Baixar Excel do Google Sheets
        run: |
          FILE_ID="1PeSi0A7m8YfUsoSkovA5iS79SkQAIip9"
          python3 - <<'PYEOF'
          import requests, sys, re, os

          file_id = "1PeSi0A7m8YfUsoSkovA5iS79SkQAIip9"
          url = f"https://docs.google.com/spreadsheets/d/{file_id}/export?format=xlsx"

          session = requests.Session()
          headers = {"User-Agent": "Mozilla/5.0 (compatible; GitHub-Actions-DataSync/1.0)"}

          print(f"Baixando: {url}")
          r = session.get(url, headers=headers, allow_redirects=True, timeout=60)
          print(f"Status: {r.status_code}, tamanho: {len(r.content)} bytes")

          content = r.content

          # Se Google retornou página de confirmação (arquivo grande), extrair token e rebaixar
          if r.status_code == 200 and content[:4] != b'PK\x03\x04':
              html = content.decode('utf-8', errors='ignore')
              if 'confirm' in html or 'download_warning' in html:
                  print("Página de confirmação detectada, extraindo token...")
                  token_match = re.search(r'confirm=([^&"\'>\s]+)', html)
                  if token_match:
                      token = token_match.group(1)
                      confirm_url = f"{url}&confirm={token}"
                      print(f"Re-baixando com token: {token}")
                      r2 = session.get(confirm_url, headers=headers, allow_redirects=True, timeout=60)
                      content = r2.content
                      print(f"Status confirmação: {r2.status_code}, tamanho: {len(content)} bytes")

          # Verificar se é XLSX válido (magic bytes PK)
          if content[:2] != b'PK':
              print("ERRO: Conteúdo baixado não é um XLSX válido.")
              print("Primeiros 500 bytes:")
              print(content[:500].decode('utf-8', errors='replace'))
              sys.exit(1)

          with open("dados.xlsx", "wb") as f:
              f.write(content)

          size_kb = len(content) / 1024
          print(f"XLSX salvo com sucesso: {size_kb:.1f} KB")
          PYEOF

      # ── A PLANILHA PRECISA CHEGAR COM OS VALORES CALCULADOS ─────────────
      # O Radar lê o dados.xlsx no navegador, e o navegador não calcula
      # fórmula: ele lê o valor que ficou gravado no arquivo. Em 27/10/2026 a
      # planilha chegou com 44.604 fórmulas e NENHUM valor gravado — o
      # openpyxl preserva a fórmula e descarta o resultado. No Excel tudo
      # parecia certo, porque o Excel recalcula ao abrir; no Radar o boi
      # perdeu 41 datas e o bezerro deflacionado mudou de patamar.
      #
      # A partir daqui o sync confere o arquivo, recalcula quando falta valor
      # e só publica se a conferência aprovar. Planilha reprovada não sobe: o
      # job fica vermelho, o GitHub avisa por e-mail e o Radar continua com a
      # última versão boa. Número errado com cara de certo é pior que número
      # de ontem.

      - name: A origem mudou desde a última publicação?
        id: origem
        run: |
          NOVO=$(sha256sum dados.xlsx | cut -d' ' -f1)
          ANTIGO=$(cat data/dados_origem.sha256 2>/dev/null || echo "")
          echo "origem baixada : $NOVO"
          echo "origem anterior: ${ANTIGO:-nenhuma registrada}"
          if [ "$NOVO" = "$ANTIGO" ]; then
            # O recálculo regrava o arquivo e muda os bytes mesmo sem dado
            # novo. Sem esta trava, cada execução publicaria um commit vazio
            # de conteúdo e dispararia um deploy à toa.
            echo "A planilha de origem não mudou. Mantendo a versão publicada."
            git checkout -- dados.xlsx
            echo "mudou=0" >> "$GITHUB_OUTPUT"
          else
            echo "$NOVO" > data/dados_origem.sha256
            echo "mudou=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Gravar os valores das fórmulas (LibreOffice em português)
        if: steps.origem.outputs.mudou == '1'
        run: |
          set -e
          if python3 scripts/recalcular_dados.py precisa dados.xlsx; then
            # O PPA traz o LibreOffice atual, que calcula FILTRO e LET. O do
            # Ubuntu (24.2) não calcula, e essas células ficariam vazias.
            sudo add-apt-repository -y ppa:libreoffice/ppa \
              || echo "PPA indisponível; seguindo com o LibreOffice do Ubuntu."
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui \
              || sudo apt-get install -y -qq libreoffice-calc
            soffice --version || true
            python3 scripts/recalcular_dados.py recalcular dados.xlsx
          else
            echo "A planilha já chegou com os valores calculados."
          fi

      - name: Conferir a planilha antes de publicar
        if: steps.origem.outputs.mudou == '1'
        run: python3 scripts/recalcular_dados.py validar dados.xlsx

      - name: Commit e push com rebase
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # SÓ estes arquivos. Um "git add -A" arrastaria o que os outros
          # workflows baixaram no mesmo minuto. A impressão digital da origem
          # sobe junto para a próxima execução saber se há dado novo.
          git add dados.xlsx data/dados_origem.sha256 2>/dev/null || git add dados.xlsx

          if git diff --staged --quiet; then
            echo "Sem mudanças. Nenhum commit necessário."
            exit 0
          fi

          git commit -m "auto: atualiza dados $(date +'%d/%m/%Y %H:%M') UTC"

          # Os outros quatro workflows dão push nesta mesma branch, e a
          # carona (workflow_run) faz o sync disparar logo depois deles.
          # Sem rebase, o push é rejeitado por non-fast-forward e o dado
          # do dia simplesmente não sobe. Mesmo padrão dos outros quatro.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Push concluído na tentativa $tentativa."
              exit 0
            fi
            echo "Push rejeitado. Rebase e nova tentativa ($tentativa/3)."
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "Não consegui publicar depois de 3 tentativas."
          exit 1
